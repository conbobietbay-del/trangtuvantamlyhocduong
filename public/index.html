<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Âm Sắc An Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage"><div id="book"></div></main>

<!-- Màn hình mở đầu: mây che bìa -->
<div id="intro">
  <div class="cloud l"></div>
  <div class="cloud r"></div>
  <button id="start" class="start" hidden>Bắt đầu</button>
</div>

<!-- Thanh công cụ -->
<nav id="bar" aria-label="Điều khiển sách">
  <button id="home" title="Về bìa sách" aria-label="Về bìa sách">⌂</button>
  <button id="tocBtn" title="Mục lục" aria-label="Mục lục">☰</button>
  <button id="prev" title="Trang trước" aria-label="Trang trước">‹</button>
  <span id="count">1 / 27</span>
  <button id="next" title="Trang sau" aria-label="Trang sau">›</button>
  <button id="music" title="Bật/tắt nhạc nền" aria-label="Bật/tắt nhạc nền">♪</button>
  <button id="full" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button>
</nav>

<aside id="toc" hidden><ul></ul></aside>

<audio id="bgm" src="audio/nhac-nen.mp3" loop preload="auto"></audio>
<audio id="flip" src="audio/lat-trang.mp3" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="app.js"></script>
</body>
</html>
