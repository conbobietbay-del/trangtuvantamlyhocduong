<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173c35">
  <title>Âm Sắc An Nam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="intro" class="intro">
      <div class="cloud cloud-left"></div>
      <div class="cloud cloud-right"></div>
      <div class="cover">
        <img src="assets/pages/cover.jpg" alt="Bìa sách Âm Sắc An Nam">
      </div>
      <button id="startBtn">Bắt đầu</button>
    </section>

    <section id="reader" class="reader hidden">
      <div id="book" class="book"></div>
      <nav class="controls">
        <button id="prevBtn">❮</button>
        <span id="pageNumber">1 / 1</span>
        <button id="nextBtn">❯</button>
        <button id="homeBtn">Về bìa</button>
        <button id="musicBtn">♫</button>
        <button id="tocBtn">Mục lục</button>
      </nav>
    </section>
  </main>

  <audio id="backgroundMusic" loop src="assets/audio/nhac-nen.mp3"></audio>
  <audio id="pageSound" src="assets/audio/lat-giay.mp3"></audio>

  <script src="app.js"></script>
</body>
</html
